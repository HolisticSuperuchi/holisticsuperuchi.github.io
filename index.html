<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI陰謀論研究所</title>
  <meta name="description" content="AI陰謀論研究所は、入力したキーワードから陰謀論風のジョークを生成するエンタメアプリです。">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #0d0e10;
      color: #f6f0e8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #0d0e10;
    }

    main {
      width: min(680px, 100%);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 8vw, 64px);
      line-height: 1.05;
    }

    p {
      margin: 0 0 16px;
      color: #d9cec3;
      font-size: 17px;
      line-height: 1.8;
    }

    a {
      color: #ff6b5f;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      color: #ffb3aa;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">AI Joke Generator</span>
    <h1>AI陰謀論研究所</h1>
    <p>無関係な言葉を、もっともらしい陰謀論風ジョークへ。AIがキーワードをもとに、こじつけ考察をフィクションとして生成します。</p>
    <p>本アプリの生成内容は娯楽目的のフィクションです。実在の人物、団体、出来事に関する事実を主張するものではありません。</p>
    <p><a href="https://sites.google.com/view/horisticsuperuchi/%E3%83%9B%E3%83%BC%E3%83%A0">プライバシーポリシー</a></p>
    <p><a href="app-ads.txt">app-ads.txt</a></p>
  </main>
</body>
</html>
